[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pathsnap-map-matching"
version = "0.2.0"
description = "Offline GPS-to-road map matching and grouped evaluation"
requires-python = ">=3.14"
dynamic = ["dependencies"]

[tool.setuptools]
packages = ["pathsnap_core"]
py-modules = ["pathsnap", "experiments", "benchmark", "api", "train", "visualize_results", "analyze_errors"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[project.optional-dependencies]
test = ["httpx==0.28.1"]
